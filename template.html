<style>
  :root {
    --bg: #f4f5f9; --surface: #ffffff; --border: #e8eaf0; --text: #141824; --text-2: #5a6274; --text-3: #8b93a5;
    --primary: #5b5bd6; --primary-soft: #ededfc;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1117; --surface: #171a22; --border: #252a35; --text: #e9ebf1; --text-2: #a2aabb; --text-3: #6d7588;
      --primary: #7b7bf0; --primary-soft: #25264d; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.65 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .logo { width: 52px; height: 52px; flex: none; border-radius: 14px; box-shadow: 0 8px 22px rgba(99, 102, 241, .3); }
  h1 { margin: 0; font: 600 24px/1.2 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .sub { color: var(--text-2); margin: 2px 0 0; font-size: 14px; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 18px; }
  nav a { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); text-decoration: none; font-weight: 600; font-size: 13px; }
  nav a:hover { color: var(--text); border-color: var(--primary); }
  section { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 26px 28px; margin-bottom: 18px; }
  h2 { margin: 0 0 4px; font: 600 19px "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .updated { color: var(--text-3); font-size: 13px; margin: 0 0 14px; }
  .lead { padding: 12px 16px; border-radius: 12px; background: var(--primary-soft); margin: 0 0 6px; }
  h3 { font-size: 15px; margin: 20px 0 4px; }
  p { margin: 0; color: var(--text-2); }
  a { color: var(--primary); }
  footer { text-align: center; color: var(--text-3); font-size: 13px; margin-top: 26px; }
  @media (max-width: 560px) { section { padding: 20px 18px; } }
</style>
</head>

<main>

          <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="c1-mark" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="0" y2="200">
          <stop offset="0" stop-color="#ffffff"/>
